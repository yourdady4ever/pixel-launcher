plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jostin.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jostin.launcher'
        minSdk 26
        targetSdk 34
        // Con tag vX.Y.Z la versión sale del tag (código X·10000 + Y·100 + Z); sin tag, del número de compilación
        def tag = (System.getenv('JOSTIN_VERSION') ?: '').replaceFirst('^v', '')
        def m = tag =~ /^(\d+)\.(\d+)\.(\d+)$/
        if (m.matches()) {
            versionCode m.group(1).toInteger() * 10000 + m.group(2).toInteger() * 100 + m.group(3).toInteger()
            versionName tag
        } else {
            versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
            versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        }
    }

    // La llave de firma vive en los secretos de GitHub (nunca en el repo, que es público).
    // build.yml la decodifica en app/release.p12 y pasa las contraseñas por variables de entorno.
    def ks = System.getenv('JOSTIN_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType 'PKCS12'
                storePassword System.getenv('JOSTIN_STORE_PASSWORD')
                keyAlias System.getenv('JOSTIN_KEY_ALIAS')
                keyPassword System.getenv('JOSTIN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sin llave no se firma: así nunca sale un APK con una llave conocida
            if (ks) signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // El servicio que corre comandos con Shizuku se habla por AIDL
    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Shizuku: comandos de sistema sin root (si no está, todo lo extra se esconde)
    def shizuku = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku"
    implementation "dev.rikka.shizuku:provider:$shizuku"
}
