name: Compilar APK

# main: solo compila (debug, para revisar). Tag vX.Y.Z: APK firmado y release (Obtainium y el actualizador la siguen).
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar debug (push a main)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar la llave de firma
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JOSTIN_KEYSTORE_B64: ${{ secrets.JOSTIN_KEYSTORE_B64 }}
        run: |
          if [ -z "$JOSTIN_KEYSTORE_B64" ]; then echo "::error::Faltan los secretos de firma (JOSTIN_KEYSTORE_B64)"; exit 1; fi
          echo "$JOSTIN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Compilar release firmado
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JOSTIN_VERSION: ${{ github.ref_name }}
          JOSTIN_STORE_PASSWORD: ${{ secrets.JOSTIN_STORE_PASSWORD }}
          JOSTIN_KEY_ALIAS: ${{ secrets.JOSTIN_KEY_ALIAS }}
          JOSTIN_KEY_PASSWORD: ${{ secrets.JOSTIN_KEY_PASSWORD }}
        run: JOSTIN_KEYSTORE_FILE="$RUNNER_TEMP/release.p12" gradle assembleRelease --no-daemon --stacktrace

      - name: Borrar la llave del equipo de GitHub
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Renombrar APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk JostinOS.apk
          else cp app/build/outputs/apk/debug/app-debug.apk JostinOS.apk; fi

      - uses: actions/upload-artifact@v4
        with:
          name: JostinOS
          path: JostinOS.apk

      - name: Activar KVM para el emulador
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capturas en emulador
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/shots.sh

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jostin OS ${{ github.ref_name }}
          files: |
            JostinOS.apk
            shots/*
